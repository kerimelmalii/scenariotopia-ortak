<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Scenariotopia: cebinizdeki senaryo atölyesi. Senaryonuzu yazın, ekibinizle eş zamanlı çalışın.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111114'/%3E%3Crect x='19' y='8' width='3' height='16' rx='1' fill='%238496E8'/%3E%3Ctext x='7' y='23' font-family='Arial' font-weight='700' font-size='17' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Scenariotopia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Yerleşim: sakin tek kabuk. Beyaz zemin, gri kutu, kutunun içinde beyaz kart; senaryo kâğıdı ortada, Courier ile. */
:root{
  --bg:#FFFFFF;--tone:#F4F4F6;--tone2:#E9E9EE;--card:#FFFFFF;--paper:#FFFFFF;
  --ink:#111114;--mute:#6F6F7A;--faint:#A3A3AD;--line:#DEDEE4;
  --dot:#1F2F6B;--good:#1E7A4C;--bad:#B3261E;
  --th1:#1F2F6B;--th2:#8A5A2B;--th3:#3F7265;--th4:#7A4668;--th5:#6F6F7A;
  --u1:#1F2F6B;--u2:#A33A2B;--u3:#1E6B52;--u4:#7A3E8F;--u5:#A8590A;--u6:#0F6A8A;--u7:#8A2F55;--u8:#5A6B12;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Courier Prime','Courier New',Courier,monospace;
  --r-s:14px;--r-m:22px;--r-l:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111114;--tone:#1A1A1F;--tone2:#26262D;--card:#111114;--paper:#15151A;
  --ink:#F3F3F5;--mute:#9C9CA8;--faint:#6A6A75;--line:#303038;
  --dot:#8496E8;--good:#5CC08C;--bad:#F08A80;
  --th1:#8496E8;--th2:#C99A6B;--th3:#7DB5A6;--th4:#C08AAE;--th5:#9C9CA8;--u1:#9AABF0;--u2:#F08E7E;--u3:#6FCFA6;--u4:#D29BE6;--u5:#F2B062;--u6:#6CC7E8;--u7:#F08BB5;--u8:#C3D46A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111114;--tone:#1A1A1F;--tone2:#26262D;--card:#111114;--paper:#15151A;
  --ink:#F3F3F5;--mute:#9C9CA8;--faint:#6A6A75;--line:#303038;
  --dot:#8496E8;--good:#5CC08C;--bad:#F08A80;
  --th1:#8496E8;--th2:#C99A6B;--th3:#7DB5A6;--th4:#C08AAE;--th5:#9C9CA8;--u1:#9AABF0;--u2:#F08E7E;--u3:#6FCFA6;--u4:#D29BE6;--u5:#F2B062;--u6:#6CC7E8;--u7:#F08BB5;--u8:#C3D46A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}

/* üst bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot);margin-left:1px}
.brand span{font-weight:500;color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--tone);border-radius:999px;padding:4px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--card);color:var(--ink)}
.top-r{display:flex;align-items:center;gap:10px}
.status{font-size:13px;color:var(--mute)}
.lang{border:0;background:var(--tone);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.lang b{font-weight:700}.lang span{color:var(--faint)}

/* başlık: ilk satır gri, ikinci satır siyah */
.head{display:flex;flex-direction:column;gap:6px}
.head h1{margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1.08;letter-spacing:-.035em;font-weight:600;text-wrap:balance}
.head h1 em{font-style:normal;color:var(--faint);display:block}
.head p{margin:6px 0 0;color:var(--mute);max-width:62ch}
.title-in{font:inherit;letter-spacing:inherit;border:0;background:transparent;padding:0;width:100%;color:var(--ink);border-radius:8px}
.title-in:hover{background:var(--tone)}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;background:var(--tone2);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.box{background:var(--tone);border-radius:var(--r-l);padding:22px}
.inner{background:var(--card);border-radius:var(--r-m);padding:18px}
.muted{color:var(--mute)}.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--tone);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
textarea,.field{width:100%;border:0;background:var(--tone);border-radius:var(--r-s);padding:12px 14px;resize:vertical;min-height:44px;line-height:1.5}
.inner textarea,.inner .field{background:var(--tone)}
.box>textarea,.box>.field{background:var(--card)}
select{border:0;background:var(--tone);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;max-width:100%}
label.lab{font-size:13px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px}
h2{font-size:20px;letter-spacing:-.02em;font-weight:600;margin:0}
h3{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}

/* senaryo görünümü */
.script-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto}
.scene-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:sc}
.scene-list button{counter-increment:sc;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-s);padding:9px 10px;cursor:pointer;display:flex;gap:10px;font-size:13px;font-weight:600;line-height:1.35}
.scene-list button::before{content:counter(sc);color:var(--faint);font-variant-numeric:tabular-nums;min-width:16px}
.scene-list button:hover{background:var(--card)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:22px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--mute)}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;background:var(--tone);border-radius:999px;padding:5px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.toolbar button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.toolbar button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.toolbar .sp{flex:1;min-width:8px}
.paper-box{padding:14px}
.paper{background:var(--paper);border-radius:var(--r-m);padding:clamp(22px,6vw,64px) clamp(16px,7vw,72px);font-family:var(--mono);font-size:16px;line-height:1.35;min-height:60vh;max-width:820px;margin:0 auto}
.b{outline:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.35em;margin-top:1.35em}
.b:first-child{margin-top:0}
.b:empty::before{content:attr(data-ph);color:var(--faint)}
.b-scene{font-weight:700;text-transform:uppercase;margin-top:2.1em}
.b-char{margin-left:38%;text-transform:uppercase}
.b-dialog{margin-left:17%;margin-right:19%;margin-top:0}
.b-paren{margin-left:28%;margin-right:26%;margin-top:0}
.b-trans{text-align:right;text-transform:uppercase}
.hint{font-size:13px;color:var(--mute);text-align:center;margin:12px 0 2px}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--tone2)}100%{background:transparent}}

/* kart tahtası */
.threads{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{display:flex;align-items:center;gap:8px;background:var(--tone);border-radius:999px;padding:5px 6px 5px 12px}
.th input{border:0;background:transparent;font-weight:600;font-size:13px;width:15ch;padding:2px}
.th button{border:0;background:transparent;color:var(--faint);cursor:pointer;border-radius:50%;width:22px;height:22px;line-height:1}
.dotc{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.act{display:flex;flex-direction:column;gap:12px}
.act-h{display:flex;align-items:baseline;gap:10px}
.act-h span{color:var(--mute);font-size:13px}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.beat{background:var(--tone);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:110px;min-width:0}
.beat.over{box-shadow:inset 0 0 0 1.5px var(--ink)}
.beat-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.beat-h b{font-weight:600;font-size:14px}
.beat-h span{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.beat .add{align-self:flex-start;border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px;border-radius:8px;margin-top:auto}
.card{background:var(--card);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab;transition:transform .15s ease}
.card:hover{transform:translateY(-1px)}
.card-top{display:flex;gap:8px;font-family:var(--mono);font-size:13px;font-weight:700;text-transform:uppercase;line-height:1.3}
.card-top span:first-child{color:var(--faint);font-variant-numeric:tabular-nums}
.card textarea{font-size:13px;padding:8px 10px;min-height:54px;border-radius:10px}
.card select{font-size:12px;padding:5px 9px;min-width:0;flex:1 1 90px}
.card .mini{border:0;background:var(--tone);border-radius:999px;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer}
.note{background:var(--tone);border-radius:var(--r-m);padding:14px 18px;font-size:14px}
.note ul{margin:6px 0 0;padding-left:18px}

/* hafıza */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.char-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.char-h b{font-family:var(--mono);font-size:15px}
.qa{display:flex;flex-direction:column;gap:10px}
.q{font-weight:600}
.a{white-space:pre-wrap;color:var(--ink)}
.issue{display:flex;flex-direction:column;gap:6px}
.issue .k{font-size:12px;font-weight:600;color:var(--mute)}

/* akademi */
.aca{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.lessons{display:flex;flex-direction:column;gap:4px;list-style:none;margin:12px 0 0;padding:0;counter-reset:ls}
.lessons button{counter-increment:ls;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-s);padding:11px 12px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
.lessons button::before{content:counter(ls);color:var(--faint);font-variant-numeric:tabular-nums}
.lessons button[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.lessons .ok{margin-left:auto;color:var(--good);font-size:13px}
.prose p{margin:0 0 14px;max-width:64ch;font-size:16px;line-height:1.65}
.big{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--mute);font-weight:500;letter-spacing:0;margin-left:6px}
.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.foot{color:var(--mute);font-size:13px;max-width:78ch}

@media (max-width:860px){
  .script-grid,.two,.aca{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .paper{font-size:14px}
  .b-char{margin-left:30%}.b-dialog{margin-left:10%;margin-right:8%}.b-paren{margin-left:20%;margin-right:14%}
  .box{padding:16px;border-radius:26px}
}

/* tanıtım sitesi */
.site{gap:112px}
.site-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.site-top .links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.hero{display:flex;flex-direction:column;gap:40px;animation:rise .5s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero h1{margin:0;font-size:clamp(38px,7.2vw,84px);line-height:1.02;letter-spacing:-.045em;font-weight:600;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--faint);display:block}
.hero p.lead{margin:0;font-size:clamp(16px,1.6vw,19px);color:var(--mute);max-width:58ch}
.hero .btn,.cta .btn{padding:14px 26px;font-size:15px}
.illu{background:var(--tone);border-radius:40px;padding:clamp(12px,2.4vw,28px);min-width:0}
.illu svg{display:block;width:100%;height:auto}
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center}
.feat:nth-of-type(even) .ftext{order:2}
.ftext{display:flex;flex-direction:column;gap:14px}
.ftext .k{font-size:14px;font-weight:600;color:var(--mute)}
.ftext h2,.sec-h h2{font-size:clamp(26px,3.4vw,40px);line-height:1.1;letter-spacing:-.035em;font-weight:600;margin:0;text-wrap:balance}
.ftext p{margin:0;color:var(--mute);font-size:17px;line-height:1.6;max-width:44ch}
.feats{display:flex;flex-direction:column;gap:112px}
.sec-h{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.sec-h h2 em{font-style:normal;color:var(--faint);display:block}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tri .box{display:flex;flex-direction:column;gap:10px;padding:28px}
.tri h3{font-size:19px;letter-spacing:-.02em}
.tri p{margin:0;color:var(--mute)}
.cta{background:var(--tone);border-radius:40px;padding:clamp(36px,7vw,84px) clamp(22px,5vw,64px);display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.cta h2{margin:0;font-size:clamp(30px,5vw,60px);line-height:1.04;letter-spacing:-.04em;font-weight:600;text-wrap:balance}
.cta h2 em{font-style:normal;color:var(--faint);display:block}
.site-foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:22px}
/* üyelik */
.auth{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.auth form{display:flex;flex-direction:column;gap:16px}
.auth h1{margin:0 0 6px;font-size:clamp(30px,4.4vw,44px);line-height:1.06;letter-spacing:-.04em;font-weight:600}
.auth h1 em{font-style:normal;color:var(--faint);display:block}
.auth input{width:100%;border:0;background:var(--tone);border-radius:var(--r-s);padding:14px 16px;font-size:16px}
.auth input:focus-visible{outline:0;box-shadow:inset 0 0 0 1.5px var(--ink)}
.auth .err{color:var(--bad);font-size:14px;font-weight:600}
.auth .btn{padding:14px 22px;font-size:15px}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.userchip i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px}
@media (max-width:860px){
  .site{gap:72px}.feats{gap:72px}
  .feat,.auth{grid-template-columns:minmax(0,1fr)}
  .feat:nth-of-type(even) .ftext{order:0}
  .tri{grid-template-columns:minmax(0,1fr)}
  .illu,.cta{border-radius:28px}
  .auth .illu{display:none}
}

/* ortak yazım */
.brand{border:0;background:none;padding:0;color:var(--ink);font-family:inherit;cursor:pointer}
.b{position:relative}
.paper.colored .b[data-a]{color:var(--ac)}
.b.locked{outline:1.5px dashed var(--lc);outline-offset:5px;border-radius:3px;cursor:not-allowed}
.b.locked::after{content:attr(data-who);position:absolute;right:0;top:-1.55em;font-family:var(--sans);font-size:11px;font-weight:700;line-height:1.5;color:var(--bg);background:var(--lc);padding:0 8px;border-radius:999px;white-space:nowrap;text-transform:none;letter-spacing:0}
.avs{display:flex;align-items:center;padding-left:6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--bg);background:var(--ac,var(--ink));font-size:12px;font-weight:700;margin-left:-6px;border:2px solid var(--bg);flex:none}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.online{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{text-align:left;border:0;background:var(--tone);border-radius:var(--r-l);padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;min-height:132px;transition:transform .15s ease}
.pcard:hover{transform:translateY(-1px)}
.pcard b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.pcard .k{font-size:12px;font-weight:600;color:var(--mute)}
.pcard.local{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.box .field,.box select{background:var(--card)}
input.field{font-size:16px;padding:12px 14px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.okmsg{color:var(--good);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
.ro-note{font-size:13px;font-weight:600;color:var(--mute)}

/* sayfalar, pdf, pencere, karakterler */
.paper-box{position:relative}
.pmarks{position:absolute;inset:0;pointer-events:none}
.pmark{position:absolute;height:0;border-top:1px dashed var(--line)}
.pmark span{position:absolute;right:10px;top:-9px;background:var(--paper);padding:0 6px;font-family:var(--mono);font-size:11px;line-height:18px;color:var(--faint)}
.pgnow{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap;padding:0 10px;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:70}

  hero_1:['Cebinizdeki','The screenwriting workshop'],hero_2:['senaryo atölyesi.','in your pocket.'],
  hero_p:['Scenariotopia’da senaryonuzu yazar, yapısını kartlarla görür, hikâyenize soru sorar ve her hafta kaleminizi geliştirirsiniz. Hepsi tek yerde.','In Scenariotopia you write your script, see its structure on cards, ask your story questions and sharpen your writing every week. All in one place.'],
  hero_see:['Nasıl çalıştığını görün','See how it works'],hero_note:['Erken erişim prototipi. Türkçe ve İngilizce.','Early-access prototype. Turkish and English.'],
  hero_alt:['Scenariotopia çalışma alanının çizimi: sahne listesi, senaryo sayfası, sahne kartları ve hikâye hafızası','Drawing of the Scenariotopia workspace: scene list, script page, scene cards and story memory'],
  f1_k:['Yazım stüdyosu','Writing studio'],f1_h:['Biçim kendiliğinden, kalem sizde.','Format takes care of itself. The pen stays with you.'],f1_p:['Sahne başlığı, aksiyon, karakter, diyalog. Enter ve Tab ile ilerlersiniz; sayfa düzenini editör kurar.','Scene heading, action, character, dialogue. You move with Enter and Tab, and the editor lays out the page.'],
  f2_k:['Kart tahtası','Card board'],f2_h:['Yapıyı bir bakışta görün.','See the structure at a glance.'],f2_p:['Her sahne bir karttır. Üç perde, 15 vuruş ya da hikâye çemberi üzerinde dizin; hangi hikâye hattının nerede kaybolduğunu tahta söyler.','Every scene is a card. Lay them out on three acts, 15 beats or the story circle, and the board tells you where a storyline drops out.'],
  f3_k:['Hikâye hafızası','Story memory'],f3_h:['Senaryonuz kendini hatırlasın.','A script that remembers itself.'],f3_p:['Karakterler, kimin neyi ne zaman öğrendiği, değişmemesi gereken bilgiler. Sorunuzu sorun, yanıt sahne numarasıyla gelsin. Olası çelişkiler öneri olarak listelenir.','Characters, who learned what and when, facts that must not change. Ask a question and the answer comes with scene numbers. Possible contradictions are listed as suggestions.'],
  f4_k:['Akademi','Academy'],f4_h:['Öğrenin, hemen yazın.','Learn, then write straight away.'],f4_p:['Kısa dersler, her dersin alıştırması ve her pazartesi yeni bir yazma görevi. Uzunluk değil, düzen önemlidir.','Short lessons, an exercise for each, and a new writing task every Monday. Regularity matters more than length.'],

  p1_h:['Sizin yerinize yazmaz','It does not write for you'],p1_p:['Hikâyenizi okur, sorunuzu yanıtlar, çelişkiyi gösterir. Sahneyi siz yazarsınız.','It reads your story, answers your question and points at the contradiction. You write the scene.'],
  p2_h:['Her uyarı bir öneridir','Every flag is a suggestion'],p2_p:['Uyarıyı yok sayabilirsiniz. Yapay zekâ özelliklerini hiç kullanmadan da yazabilirsiniz.','You can dismiss a flag. You can also write without using the AI features at all.'],

const LESSONS=[
 {id:'yapi',t:['Yapı','Structure'],b:[['Yapı, olayların sırasından çok seyircinin neyi ne zaman öğrendiğidir. Uzun metrajların çoğu üç harekete ayrılır: kahramanın düzeni bozulur, çözüm ararken işler zorlaşır, sonunda bir bedel ödenerek karar verilir.','Şablonlar haritadır, kural değildir. Sayfa numaraları yön gösterir; bir sahneniz birkaç sayfa erken ya da geç gelebilir. Asıl ölçü, her bölümün bir öncekinden daha yüksek bir bedel istemesidir.'],['Structure is less about the order of events than about what the audience learns and when. Most features fall into three movements: the hero’s order breaks, things get harder as they look for a way out, and a decision is made at a cost.','Templates are maps, not rules. Page numbers point the way; a scene may land a few pages early or late. The real test is that each section asks a higher price than the one before.']],e:['Hikâyenizi üç cümleyle yazın: düzen nasıl bozuluyor, en zor an hangisi, sonunda ne değişiyor?','Write your story in three sentences: how does the order break, what is the hardest moment, and what has changed by the end?']},
 {id:'karakter',t:['Karakter','Character'],b:[['Bir karakteri tanımlayan şey özellikleri değil, baskı altında yaptığı seçimlerdir. İki soruyla başlayın: ne istiyor ve aslında neye ihtiyacı var? İstek hikâyeyi yürütür, ihtiyaç ona anlam verir.','İstek ile ihtiyaç birbirine ters düştüğünde karakter canlanır. Her sahnede karakterin önüne, istediğine yaklaşmak için bir şeyden vazgeçmesi gereken bir seçim koyun.'],['A character is defined by the choices they make under pressure, not by a list of traits. Start with two questions: what do they want, and what do they actually need? The want drives the story; the need gives it meaning.','A character comes alive when the want and the need pull in opposite directions. In each scene, put a choice in front of them that costs something.']],e:['Ana karakteriniz için iki cümle yazın: ne istiyor ve bunu elde etmesini kendi içinde ne engelliyor?','Write two sentences about your main character: what do they want, and what inside them stands in the way?']},
 {id:'diyalog',t:['Diyalog','Dialogue'],b:[['İnsanlar ne düşündüklerini nadiren doğrudan söyler. İyi bir replik bilgi vermekten çok bir şey yapar: ikna eder, gizler, oyalar, incitir. Repliği yazmadan önce karakterin o anda karşısındakinden ne istediğini sorun.','Her karakterin kendine ait bir konuşma biçimi olmalı. Karakter adlarını kapattığınızda repliğin kime ait olduğunu anlayabiliyorsanız doğru yoldasınız. Yüksek sesle okuyun; kulağa yazı gibi gelen her şeyi kısaltın.'],['People rarely say what they think. A good line does something rather than informs: it persuades, hides, stalls, wounds. Before writing the line, ask what the character wants from the other person right now.','Each character needs a way of speaking that is theirs. If you can cover the names and still tell who is talking, you are on track. Read it aloud and trim whatever sounds written.']],e:['İki karakter bir şey üzerine pazarlık etsin ama pazarlık konusunun adını hiç anmasınlar. En fazla on replik yazın.','Have two characters bargain over something without ever naming it. Ten lines at most.']},
 {id:'sahne',t:['Sahne','Scene'],b:[['Bir sahne, bir şeyin değiştiği en küçük hikâye birimidir. Sahnenin başındaki durum ile sonundaki durum aynıysa o sahne henüz çalışmıyordur.','Sahneye olabildiğince geç girin, iş bittiği anda çıkın. Selamlaşmaları, kapı açılışlarını ve vedaları atın. Sahne başlığı yalnızca yeri ve zamanı söyler; duyguyu aksiyon ve diyalog taşır.'],['A scene is the smallest unit of story in which something changes. If the situation at the end matches the situation at the start, the scene is not working yet.','Enter as late as you can and leave as soon as the job is done. Cut greetings, door openings and goodbyes. The heading only gives place and time; action and dialogue carry the feeling.']],e:['Bir sahnenizin başındaki ve sonundaki durumu birer cümleyle yazın. Değişen bir şey yoksa sahneyi neyin değiştireceğini ekleyin.','Describe the situation at the start and at the end of one of your scenes, one sentence each. If nothing changes, add what would change it.']},
 {id:'altmetin',t:['Alt metin','Subtext'],b:[['Alt metin, söylenen ile kastedilen arasındaki boşluktur. Seyirci o boşluğu kendisi doldurduğunda sahneye ortak olur. Karakteriniz duygusunu adıyla söylüyorsa seyirciye yapacak iş kalmaz.','Duyguyu nesnelere ve eylemlere taşıyın: yarım bırakılan çay, iki kez kilitlenen kapı, cevapsız kalan basit bir soru. Senaryoda yalnızca görülebilen ve duyulabilen şeyler yazılır; içerideki dünya dışarıdan okunur.'],['Subtext is the gap between what is said and what is meant. The audience joins the scene when they fill that gap themselves. If your character names the feeling, there is nothing left for them to do.','Move the feeling into objects and actions: a tea left half drunk, a door locked twice, a simple question left unanswered. A script holds only what can be seen and heard; the inner world is read from outside.']],e:['Bir karakter üzgün olduğunu hiç söylemeden yemek hazırlasın. Yalnızca aksiyon satırları yazın.','Have a character cook a meal without ever saying they are sad. Action lines only.']},
 {id:'yeniden',t:['Yeniden yazım','Rewriting'],b:[['İlk taslak hikâyeyi bulmak içindir, iyi yazmak için değil. Yeniden yazarken her şeyi birden düzeltmeye çalışmayın; geçişler halinde çalışın: önce yapı, sonra sahneler, en son replikler.','Her geçişte tek bir soru sorun. Bu sahne olmasa hikâye anlaşılır mı? Bu repliği kim söylese fark etmez mi? En sevdiğiniz satır hikâyeye hizmet etmiyorsa onu başka bir dosyaya taşıyın ve devam edin.'],['The first draft is for finding the story, not for writing it well. Do not fix everything at once when you rewrite; work in passes: structure first, then scenes, lines last.','Ask a single question in each pass. Would the story still be clear without this scene? Could anyone say this line? If your favourite line does not serve the story, move it to another file and keep going.']],e:['Bir sahneyi yarı uzunluğuna indirin. Neyi çıkardığınızı ve nedenini bir cümleyle not edin.','Cut a scene to half its length. Note in one sentence what you removed and why.']}
];

    let nxt=null;for(let j=i+1;j<B.length;j++){if(typeof B[j].p==='number'&&B[j].p>last){nxt=B[j].p;break;}}

        blockLines[j]=ls.length;u.lines.push(...ls);}
      i=j-1;units.push(u);continue;}
    const isS=b.t==='scene',isT=b.t==='trans';const txt=(isS||isT)?up(String(b.x).trim()):b.x;
    const lines=isT?[{t:txt,align:'right',bi:i,li:0,k:'trans'}]:wrapText(txt,C).map((t0,li)=>({t:t0,ind:0,bi:i,li,k:b.t,bold:isS}));
    blockLines[i]=lines.length;units.push({kind:b.t,lines});}
  units.forEach((u,ui)=>{
    const n=u.lines.length,head=y>0?1:0;
    if(u.kind==='scene'){const nx=units[ui+1];const extra=nx?Math.min(2,nx.lines.length):0;if(y>0&&y+head+n+extra>L)flush();gap();u.lines.forEach(put);return;}
    if(y+head+n<=L){gap();u.lines.forEach(put);return;}
    let rest=u.lines.slice(),first=true;
    while(rest.length){const hd=(first&&y>0)?1:0;const avail=L-y-hd;
      if(rest.length<=avail){if(first)gap();rest.forEach(put);break;}
      if(u.kind==='speech'){let k=avail-1;const minFirst=first?3:2;
        if(k>=minFirst&&rest.length-k>=2){if(first)gap();rest.slice(0,k).forEach(put);put({t:t('more'),ind:22,k:'more'});flush();put({t:u.name+t('contd'),ind:22,k:'cont'});rest=rest.slice(k);first=false;}
        else if(y===0){const kk=Math.max(1,L-2);rest.slice(0,kk).forEach(put);put({t:t('more'),ind:22,k:'more'});flush();put({t:u.name+t('contd'),ind:22,k:'cont'});rest=rest.slice(kk);first=false;}
        else flush();}
      else{if(avail>=2&&rest.length-avail>=2&&u.kind==='action'){if(first)gap();rest.slice(0,avail).forEach(put);flush();rest=rest.slice(avail);first=false;}
        else if(y===0){rest.slice(0,L).forEach(put);flush();rest=rest.slice(L);first=false;}
        else flush();}
    }
  });
  if(page.length||!pages.length)pages.push(page);
  const starts=pages.map(pg=>{const it=pg.find(l=>l.bi!=null);return it?{bi:it.bi,li:it.li,frac:blockLines[it.bi]?it.li/blockLines[it.bi]:0}:null;});
  const blockPage={};pages.forEach((pg,pi)=>pg.forEach(l=>{if(l.bi!=null&&blockPage[l.bi]==null)blockPage[l.bi]=pi;}));
  const lastPg=pages[pages.length-1];const fill=lastPg.length?(lastPg[lastPg.length-1].y+1)/L:0;
  const empty=!units.length;
  return {pages,starts,blockPage,g,count:empty?0:pages.length,frac:empty?0:pages.length-1+fill};
}

      if(sub){doc.setFont('CourierPrime','normal');yy+=lh;wrapText(sub,50).forEach(l=>{doc.text(l,W/2,yy,{align:'center'});yy+=lh;});}
      doc.setFont('CourierPrime','normal');yy+=lh*2;

      });
    });
    downloadBlob(doc.output('blob'),fileName()+'.pdf');closeModal();
  }catch(e){msg.textContent=t('pdf_fail');btn.disabled=false;}
}

function relTime(d){const s=(new Date(d).getTime()-Date.now())/1000;const rtf=new Intl.RelativeTimeFormat(P.lang==='en'?'en':'tr',{numeric:'auto'});
  const a=Math.abs(s);if(a<60)return rtf.format(Math.round(s),'second');if(a<3600)return rtf.format(Math.round(s/60),'minute');if(a<86400)return rtf.format(Math.round(s/3600),'hour');if(a<86400*30)return rtf.format(Math.round(s/86400),'day');return new Date(d).toLocaleDateString(P.lang==='en'?'en-GB':'tr-TR',{day:'numeric',month:'long'});}
async function loadFeed(projects,folders){
  const box=document.getElementById('feed');if(!box||!SB)return;
  const [rb,rp,rc]=await Promise.all([SB.from('scn_blocks').select('project_id,author_id,updated_at,text,type').order('updated_at',{ascending:false}).limit(400),SB.from('scn_profiles').select('id,display_name,color').limit(80),SB.from('scn_comments').select('id,project_id,block_id,author_id,body,quote,created_at').order('created_at',{ascending:false}).limit(30)]);
  const f=document.getElementById('feed');if(!f||UI.view!=='projects')return;
  const people=rp.error?[]:(rp.data||[]);const pm={};people.forEach(p=>pm[p.id]=p);
  const prj={};projects.forEach(p=>prj[p.id]=p);const fm={};folders.forEach(x=>fm[x.id]=x);
  const groups=[];const GAP=2*3600e3;
  (rb.error?[]:(rb.data||[])).forEach(b=>{if(!b.author_id||!prj[b.project_id])return;const tm=new Date(b.updated_at).getTime();
    let g=groups.find(g=>g.a===b.author_id&&g.p===b.project_id&&g.oldest-tm<GAP);
    if(!g){g={a:b.author_id,p:b.project_id,at:b.updated_at,oldest:tm,n:0,snip:null};groups.push(g);}
    g.n++;g.oldest=Math.min(g.oldest,tm);if(b.text&&b.text.trim()&&b.type!=='trans'&&(!g.snip||(g.snip.type==='scene'&&b.type!=='scene')))g.snip=b;});

  const gi=groups.slice(0,14).map(g=>{const u=pm[g.a]||{display_name:'?',color:1};const mine=g.a===ME.id;const c=mine?ME.color:(u.color||1);const p=prj[g.p];
    const sn=g.snip?`<div class="snip" style="border-left-color:var(--u${c})">${esc(g.snip.text.length>220?g.snip.text.slice(0,220)+'…':g.snip.text)}</div>`:'';
    return {at:g.at,h:`<article class="post"><div class="ph"><span class="pav" style="background:var(--u${c})" aria-hidden="true">${initial(mine?ME.name:u.display_name)}</span><div><b>${esc(mine?t('you'):u.display_name)}</b><small>${esc(t('feed_worked',{p:pname(p)}))} · ${t('feed_lines',{n:g.n})} · ${esc(relTime(g.at))}</small></div></div>${sn}<div class="pact"><button class="btn sm" data-act="open" data-id="${p.id}">${t('open_proj')}</button></div></article>`};});
  const ci=(rc&&!rc.error?(rc.data||[]):[]).filter(c=>prj[c.project_id]).map(c=>{const u=pm[c.author_id]||{display_name:'?',color:1};const mine=c.author_id===ME.id;const col=mine?ME.color:(u.color||1);const p=prj[c.project_id];
    return {at:c.created_at,h:`<article class="post"><div class="ph"><span class="pav" style="background:var(--u${col})" aria-hidden="true">${initial(mine?ME.name:u.display_name)}</span><div><b>${esc(mine?t('you'):u.display_name)} <span style="font-weight:500;color:var(--mute)">${t('feed_cmt')}</span></b><small>${esc(pname(p))} · ${esc(relTime(c.created_at))}</small></div></div><p style="margin:0;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere">${esc(trunc(c.body,400))}</p>${c.quote?`<div class="snip" style="border-left-color:var(--dot);color:var(--mute)">${esc(trunc(c.quote,160))}</div>`:''}<div class="pact"><button class="btn sm" data-act="open" data-id="${p.id}" data-cmt="${esc(c.block_id)}">${t('open_proj')}</button></div></article>`};});
  const items=gi.concat(ci).sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0).slice(0,16).map(x=>x.h);
  const aca=document.querySelector('[data-aca-slot]');const acaHtml=aca?aca.innerHTML:'';if(aca)aca.remove();
  if(!items.length)f.innerHTML=`<div class="empty">${t('feed_empty')}</div>`+acaHtml;
  else{items.splice(Math.min(2,items.length),0,acaHtml);f.innerHTML=items.join('');}
  const pe=document.getElementById('people');
  if(pe){const list=people.slice().sort((a,b)=>(a.id===ME.id?-1:b.id===ME.id?1:String(a.display_name).localeCompare(String(b.display_name))));
    pe.innerHTML=list.length?list.slice(0,24).map(p=>`<div class="person"><span class="pav" style="background:var(--u${p.id===ME.id?ME.color:(p.color||1)})" aria-hidden="true">${initial(p.display_name)}</span><span>${esc(p.display_name)}${p.id===ME.id?` <span class="muted">· ${t('you')}</span>`:''}</span></div>`).join(''):`<span class="small muted">—</span>`;}
}

function authErr(m){m=String(m||'').toLowerCase();return m.includes('already')||m.includes('registered')?t('err_exists'):m.includes('invalid login')?t('err_login'):m.includes('not confirmed')?t('err_confirm'):m.includes('rate')||m.includes('too many')?t('err_rate'):m.includes('password')?t('err_pass'):t('err_generic');}
app.addEventListener('submit',async e=>{
  const id=e.target.id;
  if(id==='pdfForm'){e.preventDefault();makePdf(e.target);return;}
  if(['authForm','newProjForm','claimForm','addMemberForm','newEpForm','addFMemberForm'].includes(id))e.preventDefault();else return;
  if(!SB){toast(t('err_nocloud'));return;}
  if(id==='authForm'){
    const su=UI.view==='signup',f=e.target,err=document.getElementById('au-err'),btn=f.querySelector('button[type=submit]');
    const name=su?f.name.value.trim():'',email=f.email.value.trim(),pass=f.pass.value;
    const show=m=>{err.hidden=false;err.textContent=m;};
    const bad=(su&&!name)?['err_name',f.name]:!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?['err_email',f.email]:pass.length<8?['err_pass',f.pass]:null;
    if(bad){show(t(bad[0]));bad[1].focus();return;}
    btn.disabled=true;UI.authBusy=true;
    try{
      if(su){
        const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{scn_name:name},emailRedirectTo:location.origin+location.pathname}});
        if(error){show(authErr(error.message));return;}
        if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){show(t('err_exists'));return;}
        if(data.session){await loadMe(data.session.user);UI.view='projects';render();window.scrollTo(0,0);}
        else{UI.sentTo=email;UI.view='sent';render();window.scrollTo(0,0);}
      }else{
        const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
        if(error){show(authErr(error.message));return;}
        await loadMe(data.user);UI.view='projects';render();window.scrollTo(0,0);
      }
    }catch(x){show(t('err_nocloud'));}
    finally{UI.authBusy=false;if(btn.isConnected)btn.disabled=false;}
  }else if(id==='newProjForm'){
    const ti=document.getElementById('np-title'),kind=(e.submitter&&e.submitter.value)||'single';e.target.querySelectorAll('button').forEach(x=>x.disabled=true);
    if(kind==='series'){const {data,error}=await SB.rpc('scn_create_folder',{p_title:ti.value.trim()});if(error||!data){toast(t('err_generic'));e.target.querySelectorAll('button').forEach(x=>x.disabled=false);return;}UI.folderId=data;UI.view='folder';render();window.scrollTo(0,0);return;}
    const {data,error}=await SB.rpc('scn_create_project',{p_title:ti.value.trim()});
    e.target.querySelectorAll('button').forEach(x=>x.disabled=false);if(error||!data){toast(t('err_generic'));return;}
    openProject(data);
  }else if(id==='newEpForm'){
    const ti=document.getElementById('ne-title');e.target.querySelector('button').disabled=true;
    const {data,error}=await SB.rpc('scn_create_episode',{p_folder:UI.folderId,p_title:ti.value.trim()});
    if(error||!data){toast(t('err_generic'));e.target.querySelector('button').disabled=false;return;}
    openProject(data);
  }else if(id==='addFMemberForm'){
    const em=document.getElementById('fm-email'),role=document.getElementById('fm-role').value,m=document.getElementById('fm-msg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){m.className='err';m.textContent=t('err_email');em.focus();return;}
    const {data,error}=await SB.rpc('scn_add_folder_member',{p_folder:UI.folderId,p_email:em.value.trim(),p_role:role});const code=error?'err':data;
    UI.fmMsg=[code==='ok'?'okmsg':'err',code==='ok'?t('am_ok'):code==='no_user'?t('am_no_user'):code==='no_profile'?t('am_no_profile'):t('err_generic')];
    if(code==='ok')loadFolder();else{m.className=UI.fmMsg[0];m.textContent=UI.fmMsg[1];}
  }else if(id==='claimForm'){
    const c=document.getElementById('cl-code').value.trim(),m=document.getElementById('cl-msg');
    const {data,error}=await SB.rpc('scn_claim_admin',{code:c});
    if(error||!data){m.className='err';m.textContent=t('claim_bad');return;}
    ME.admin=true;render();toast(t('claim_ok'));
  }else if(id==='addMemberForm'){
    const em=document.getElementById('am-email'),role=document.getElementById('am-role').value,m=document.getElementById('am-msg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){m.className='err';m.textContent=t('err_email');em.focus();return;}
    const {data,error}=CLOUD.folder?await SB.rpc('scn_add_folder_member',{p_folder:CLOUD.folder.id,p_email:em.value.trim(),p_role:role}):await SB.rpc('scn_add_member',{p_project:CLOUD.pid,p_email:em.value.trim(),p_role:role});
    const code=error?'err':data;
    UI.amMsg=[code==='ok'?'okmsg':'err',code==='ok'?t('am_ok'):code==='no_user'?t('am_no_user'):code==='no_profile'?t('am_no_profile'):t('err_generic')];
    m.className=UI.amMsg[0];m.textContent=UI.amMsg[1];
    if(code==='ok'){em.value='';await reloadMembers();}
  }
});

const TQ=new Map(),TDEL=new Set();let tFlushT=null,tLoadT=null;

async function tFlush(){
  if(!CLOUD||!SB)return;tFlushT=null;const pid=CLOUD.pid;const ids=[...TQ.keys()];TQ.clear();const dels=[...TDEL];TDEL.clear();
  const rows=ids.map(tRow).filter(Boolean);const secs=rows.filter(r=>!r.parent),items=rows.filter(r=>r.parent);
  try{
    if(dels.length){const {error}=await SB.from('scn_treat').delete().in('id',dels);if(error)throw error;}
    if(secs.length){const {error}=await SB.from('scn_treat').upsert(secs);if(error)throw error;}
    if(items.length){const {error}=await SB.from('scn_treat').upsert(items);if(error)throw error;}
    if(CLOUD&&CLOUD.pid===pid){CLOUD.changed=true;if(!TQ.size&&!TDEL.size)setCloud('ok');}
  }catch(e){if(!CLOUD||CLOUD.pid!==pid)return;ids.forEach(i=>{if(!TQ.has(i))TQ.set(i,1);});dels.forEach(d=>TDEL.add(d));setCloud('err');clearTimeout(tFlushT);tFlushT=setTimeout(tFlush,4000);}

function parseTreat(txt){

    const m=line.match(/^(\d{1,3})\s*[.)\-–]\s*(.*)$/);
    if(m){if(!cur)mk('');const sp=splitHead(m[2]);last={id:uid(),hd:sp.hd,x:sp.x,p:0,a:CLOUD&&ME?ME.id:null};cur.items.push(last);return;}
    const head=line.length<=60&&/\p{L}/u.test(line)&&line===line.toLocaleUpperCase(P.lang==='en'?'en':'tr')&&!/[.!?…,;:]$/.test(line);

function moveScene(id,dir){
  pushUndo();
  const sc=scenes(),k=sc.findIndex(s=>s.id===id),j=k+dir;if(k<0||j<0||j>=sc.length)return;
  const a=sc[Math.min(k,j)],b=sc[Math.max(k,j)];
  const head=P.blocks.slice(0,a.start),A=P.blocks.slice(a.start,a.end),B=P.blocks.slice(b.start,b.end),tail=P.blocks.slice(b.end);

}

function aiGuard(out){const s=scriptText();if(s.length<40){out(t('ai_empty'));return null;}if(s.length>200000){out(t('ai_long'));return null;}return s;}
const LANGNAME=()=>P.lang==='en'?'English':'Turkish';
async function doAsk(){
  if(UI.busyAsk)return;const qEl=document.getElementById('askQ');const q=(qEl.value||'').trim();if(!q){qEl.focus();return;}
  const show=s=>{UI.askOut=s;const o=document.getElementById('askOut');if(o){o.hidden=!s;o.textContent=s;}};
  const script=aiGuard(show);if(!script)return;
  UI.busyAsk=true;const btn=document.getElementById('askBtn'),sb=document.getElementById('stopBtn');if(btn)btn.disabled=true;show(t('thinking'));
  await sampleReady;
  const fin=()=>{UI.busyAsk=false;const b=document.getElementById('askBtn'),s=document.getElementById('stopBtn');if(b)b.disabled=false;if(s)s.hidden=true;};
  if(!sampleFn){show(t('ai_none'));fin();return;}
  ctl=new AbortController();if(sb)sb.hidden=false;
  const prompt=`You are the story memory of a screenwriting tool. Answer the writer's question using ONLY the screenplay and notes below. Cite scene numbers in parentheses for every claim. If the screenplay does not answer the question, say so plainly; never invent story facts. Do not rewrite or continue the script. Answer in ${LANGNAME()}, in at most 120 words, plain text without markdown.\n\n=== SCREENPLAY ===\n${script}\n\n=== WRITER'S NOTES ===\n${memoryText()||'(none)'}\n\n=== QUESTION ===\n${q}`;
  try{
    const r=await sampleFn(prompt,{signal:ctl.signal,cache:false,onText:({text})=>show(text)});
    P.qa.unshift({q,a:r.text});P.qa=P.qa.slice(0,8);touch();show('');
    if(UI.view==='memory'){renderView();}
  }catch(e){const keep=e&&e.text;if(keep){P.qa.unshift({q,a:keep});P.qa=P.qa.slice(0,8);touch();}show(aiErr(e));if(keep&&UI.view==='memory'){const o=UI.askOut;renderView();UI.askOut=o;}}
  fin();
}
async function doCheck(){
  if(UI.busyCheck)return;const msg=s=>{const m=document.getElementById('checkMsg');if(m)m.textContent=s;};
  const script=aiGuard(msg);if(!script)return;
  UI.busyCheck=true;const btn=document.getElementById('checkBtn');if(btn)btn.disabled=true;msg(t('thinking'));
  await sampleReady;
  const fin=()=>{UI.busyCheck=false;const b=document.getElementById('checkBtn');if(b)b.disabled=false;};
  if(!sampleFn){msg(t('ai_none'));fin();return;}
  const prompt=`You are a continuity checker for a screenplay. Find contradictions between scenes, or between the script and the writer's notes: timeline and dates, what a character knows versus when they learned it, established facts, names, ages, places. A character deliberately lying is NOT a contradiction; mention it only if the script itself gives no sign the lie is intended. Report only issues you can support with two specific places in the text. Return ONLY a JSON array (no prose) of at most 8 objects with keys: "scene" (number of the later scene where the issue shows), "kind" (one or two words in ${LANGNAME()}), "issue" (one sentence in ${LANGNAME()}), "evidence" (the two places compared, with scene numbers, in ${LANGNAME()}). Return [] if you find none.\n\n=== SCREENPLAY ===\n${script}\n\n=== WRITER'S NOTES ===\n${memoryText()||'(none)'}`;
  try{
    let r=await sampleFn.json(prompt,{cache:false});
    if(r&&!Array.isArray(r)&&Array.isArray(r.items))r=r.items;
    if(!Array.isArray(r))throw {code:'bad'};
    P.checks=r.slice(0,8).filter(x=>x&&x.issue).map(x=>({scene:x.scene!=null?String(x.scene).replace(/[^0-9]/g,''):'',kind:String(x.kind||''),issue:String(x.issue),evidence:String(x.evidence||'')}));
    touch();msg('');const l=document.getElementById('checkList');if(l)l.innerHTML=checksHtml();
  }catch(e){msg(aiErr(e)||t('ai_fail'));}
  fin();
}

  else if(act==='addThread'){const used=P.threads.map(x=>x.c);const c=[1,2,3,4,5].find(n=>!used.includes(n))||5;P.threads.push({id:'th'+uid(),name:t('th_new'),c});touch();renderView();}
  else if(act==='delThread'){P.threads=P.threads.filter(x=>x.id!==id);for(const k in P.cards)if(P.cards[k].th===id)P.cards[k].th='';touch();renderView();}
  else if(act==='addScene'){const nb={id:uid(),t:'scene',x:''};P.blocks.push(nb,{id:uid(),t:'action',x:''});const c=card(nb.id);if(a.dataset.beat)c.beat[P.structure]=a.dataset.beat;touch();UI.jump=nb.id;UI.view='script';render();const el=document.querySelector('.b[data-id="'+nb.id+'"]');if(el)el.focus();}
  else if(act==='up')moveScene(id,-1);
  else if(act==='down')moveScene(id,1);
  else if(act==='ask')doAsk();
  else if(act==='stop'){if(ctl)ctl.abort();}
  else if(act==='check')doCheck();
  else if(act==='dismiss'){P.checks.splice(Number(a.dataset.i),1);if(!P.checks.length)P.checks=null;touch();const l=document.getElementById('checkList');if(l)l.innerHTML=checksHtml();}
  else if(act==='lesson'){UI.lesson=id;if(a.dataset.go)UI.view='academy';a.dataset.go?render():renderView();}
  else if(act==='lessonDone'){P.lessonDone[id]=!P.lessonDone[id];touch();renderView();}
  else if(act==='fb')doFb(id);
  else if(act==='weekDone'){const w=P.weekly[id]||(P.weekly[id]={text:'',done:false});w.done=!w.done;touch();renderView();}
});
app.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('b')){
    const i=bIndex(el.dataset.id);if(i<0)return;const b=P.blocks[i];if(CLOUD)claimBlock(b.id);maybeTypeUndo(b.id);
    if(el.childNodes.length===1&&el.firstChild.nodeName==='BR')el.textContent='';
    b.x=clean(el);
    if(b.t==='action'&&isHeading(b.x)){b.t='scene';el.className='b b-scene';el.dataset.ph=t('ph_scene');markType('scene');const m=b.x.match(/^\s*(int|ext|est)(?=[.\s\/])/i);if(m&&m[1]!==m[1].toUpperCase()){b.x=b.x.replace(m[1],m[1].toUpperCase());el.textContent=b.x;setCaret(el,b.x.length);}}
    afterEdit(b.t==='scene'||b.t==='char');return;
  }
  const f=el.dataset&&el.dataset.f;if(!f)return;const id=el.dataset.id,val=el.value;
  if(f==='title')P.title=val;
  else if(f==='sum')card(id).sum=val;
  else if(f==='thname'){const th=P.threads.find(x=>x.id===id);if(th)th.name=val;}
  else if(f==='cwant'||f==='cneed'||f==='cknows'||f==='cnote'){const c=P.chars[id]||(P.chars[id]={});c[f.slice(1)]=val;}
  else if(f==='facts')P.facts=val;
  else if(f==='tsh'){const sc=treat().secs.find(x=>x.id===id);if(sc){sc.h=val;tMark(sc.id);}return;}
  else if(f==='thd'){const r=tFind(id);if(!r)return;r.it.hd=val;if(CLOUD)r.it.a=ME.id;tMark(id);return;}
  else if(f==='tix'){const r=tFind(id);if(!r)return;r.it.x=val;if(CLOUD)r.it.a=ME.id;sizeTx(el);tStatUpd();tMark(id);return;}
  else if(f==='ex')P.ex[id]=val;
  else if(f==='week'){const w=P.weekly[id]||(P.weekly[id]={text:'',done:false});w.text=val;}
  else return;
  touch();
});
app.addEventListener('change',async e=>{
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;const id=el.dataset.id;
  if(f==='frole'){const {error}=await SB.from('scn_folder_members').update({role:el.value}).eq('folder_id',UI.folderId).eq('user_id',id);if(error)toast(t('err_generic'));else loadFolder();return;}
  if(f==='ftitle'){const v2=el.value.trim();if(!v2)return;const {error}=await SB.from('scn_folders').update({title:v2}).eq('id',UI.folderId);if(error)toast(t('err_generic'));else toast(t('saved_now'));return;}
  if(f==='mrole'){const mm=CLOUD.members.find(m=>m.id===id);const {error}=(CLOUD.folder&&mm&&mm.src==='folder')?await SB.from('scn_folder_members').update({role:el.value}).eq('folder_id',CLOUD.folder.id).eq('user_id',id):await SB.from('scn_members').update({role:el.value}).eq('project_id',CLOUD.pid).eq('user_id',id);if(error)toast(t('err_generic'));else reloadMembers();return;}
  if(f==='th'){card(id).th=el.value;touch();renderView();}
  else if(f==='beat'){const c=card(id);c.beat=c.beat||{};c.beat[P.structure]=el.value;touch();renderView();}
  else if(f==='thname'){renderView();}
});
window.addEventListener('beforeunload',e=>{if(!CLOUD){try{localStorage.setItem(LS,JSON.stringify(P));}catch(_){}}else if(flushT||metaT||flushing||CLOUD.state==='err'){flushBlocks();saveMeta();e.preventDefault();e.returnValue='';return '';}});
const HASH0=location.hash;
function cleanHash(){if(location.href.indexOf('#')>-1&&(location.hash===''||location.hash==='#'||/access_token|refresh_token|error_description|type=/.test(location.hash))){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}}
(async function boot(){
  if(/error_description=/.test(HASH0)){try{const m=decodeURIComponent((HASH0.match(/error_description=([^&]*)/)||[])[1]||'').replace(/\+/g,' ');toast(/expired|invalid/i.test(m)?t('link_expired'):m);}catch(e){}}
  if(!SB){cleanHash();return;}
  try{const {data}=await SB.auth.getSession();if(data&&data.session){await loadMe(data.session.user);if(SITE.includes(UI.view)){UI.view='projects';render();}}}catch(e){}
  cleanHash();
  SB.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{cleanHash();
    if(ev==='SIGNED_OUT'&&ME){ME=null;await leaveProject(true);UI.view='home';render();}
    else if(ev==='SIGNED_IN'&&session&&!ME&&!UI.authBusy){try{await loadMe(session.user);UI.view='projects';render();}catch(e){}}
  },0);});
})();

render();
})();
</script>
